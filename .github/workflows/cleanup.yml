name: 🧹 Cleanup

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write

jobs:
  excluir-branch:
    name: Excluir branch mergeada
    # Só PRs mergeados (não os fechados sem merge), do próprio repositório e nunca as branches principais.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'main' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Excluir a branch ${{ github.head_ref }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" --silent 2>erro.txt; then
            echo "Branch \`$BRANCH\` excluída após o merge do PR #${{ github.event.pull_request.number }}." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q "Reference does not exist" erro.txt; then
            echo "Branch \`$BRANCH\` já havia sido excluída." >> "$GITHUB_STEP_SUMMARY"
          else
            cat erro.txt
            exit 1
          fi
