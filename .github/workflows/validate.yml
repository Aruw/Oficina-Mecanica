name: 🔍 Validate

on:
  push:
    branches-ignore:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-testes:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (compilação do código e dos testes)
        run: mvn -B test-compile

      - name: Testes unitários
        run: mvn -B test -Dtest='**/*Test*' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Testes de integração
        run: mvn -B test -Dtest='**/*IT' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Relatório de cobertura (JaCoCo)
        if: success() || failure()
        run: mvn -B jacoco:report

      - name: Cobertura mínima de 80% (domain + application)
        run: mvn -B jacoco:check@check

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Resultado — \`${GITHUB_REF_NAME}\`"
            if [ -d target/surefire-reports ]; then
              cat target/surefire-reports/TEST-*.xml | grep -o '<testsuite [^>]*>' | awk '
                { match($0,/tests="[0-9]+"/); t+=substr($0,RSTART+7,RLENGTH-8)
                  match($0,/failures="[0-9]+"/); f+=substr($0,RSTART+10,RLENGTH-11)
                  match($0,/errors="[0-9]+"/); e+=substr($0,RSTART+8,RLENGTH-9) }
                END { printf "| Testes | Falhas | Erros |\n|---|---|---|\n| %d | %d | %d |\n\n", t, f, e }'
            fi
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR>1 && ($2 ~ /domain|application/) {mi+=$4; ci+=$5; ml+=$8; cl+=$9}
                END {printf "**Cobertura dos domínios críticos:** linhas %.1f%% · instruções %.1f%% (mínimo 80%%)\n", 100*cl/(cl+ml), 100*ci/(ci+mi)}' \
                target/site/jacoco/jacoco.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefato — diagnóstico da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-falha
          path: |
            app/target/surefire-reports
            app/target/site/jacoco
          retention-days: 7
