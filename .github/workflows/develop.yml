name: 🔨 Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-testes:
    name: Build, testes e cobertura
    # O merge do bump de versão (PR chore/proxima-versao-*) só altera o pom e já foi validado na própria branch.
    if: >
      github.event_name != 'push' || !(
        contains(github.event.head_commit.message, 'chore/proxima-versao-') ||
        startsWith(github.event.head_commit.message, 'chore: próxima versão') ||
        startsWith(github.event.head_commit.message, 'chore: prepara a próxima versão'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (compilação do código e dos testes)
        run: mvn -B test-compile

      - name: Testes unitários
        run: mvn -B test -Dtest='**/*Test*' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Testes de integração
        run: mvn -B test -Dtest='**/*IT' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Relatório de cobertura (JaCoCo)
        if: success() || failure()
        run: mvn -B jacoco:report

      - name: Cobertura mínima de 80% (domain + application)
        run: mvn -B jacoco:check@check

      - name: Empacotar aplicação (jar)
        run: mvn -B package -DskipTests -Djacoco.skip=true

      - name: Resumo dos testes e da cobertura
        if: always()
        run: |
          {
            echo "### Testes"
            if [ -d target/surefire-reports ]; then
              cat target/surefire-reports/TEST-*.xml | grep -o '<testsuite [^>]*>' | awk '
                { match($0,/tests="[0-9]+"/); t+=substr($0,RSTART+7,RLENGTH-8)
                  match($0,/failures="[0-9]+"/); f+=substr($0,RSTART+10,RLENGTH-11)
                  match($0,/errors="[0-9]+"/); e+=substr($0,RSTART+8,RLENGTH-9) }
                END { printf "| Testes | Falhas | Erros |\n|---|---|---|\n| %d | %d | %d |\n\n", t, f, e }'
            fi
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR>1 && ($2 ~ /domain|application/) {mi+=$4; ci+=$5; ml+=$8; cl+=$9}
                END {printf "**Cobertura dos domínios críticos:** linhas %.1f%% · instruções %.1f%% (mínimo 80%%)\n", 100*cl/(cl+ml), 100*ci/(ci+mi)}' \
                target/site/jacoco/jacoco.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefato — resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-testes
          path: app/target/surefire-reports

      - name: Artefato — cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: app/target/site/jacoco

      - name: Artefato — aplicação (jar)
        uses: actions/upload-artifact@v4
        with:
          name: oficina-jar
          path: app/target/oficina-*.jar
          retention-days: 14

  analise-estatica:
    name: Análise estática (CodeQL, PMD e Sonar)
    runs-on: ubuntu-latest
    needs: build-testes
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Checkout (histórico completo para o Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-jacoco
          path: app/target/site/jacoco

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Build
        working-directory: app
        run: mvn -B -q test-compile

      - name: CodeQL — análise de segurança e qualidade
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-java
          output: codeql-resultados

      - name: PMD — boas práticas
        working-directory: app
        run: mvn -B pmd:pmd

      - name: CPD — código duplicado
        working-directory: app
        run: mvn -B pmd:cpd

      - name: SonarQube Cloud — qualidade, cobertura e code smells
        if: env.SONAR_TOKEN != ''
        working-directory: app
        run: |
          ARGS=()
          [ -n "$SONAR_ORGANIZATION" ] && ARGS+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          [ -n "$SONAR_PROJECT_KEY" ] && ARGS+=("-Dsonar.projectKey=$SONAR_PROJECT_KEY")
          mvn -B sonar:sonar "${ARGS[@]}"

      - name: SonarQube Cloud — não configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::Análise do SonarQube Cloud ignorada. Cadastre o secret SONAR_TOKEN para habilitá-la (veja docs/processo/github.md)."

      - name: Resumo da análise estática
        if: always()
        run: |
          violacoes=$(grep -c '<violation' app/target/pmd.xml 2>/dev/null || true)
          duplicacoes=$(grep -c '<duplication' app/target/cpd.xml 2>/dev/null || true)
          alertas=$(cat codeql-resultados/*.sarif 2>/dev/null | grep -o '"ruleId"' | wc -l)
          if [ -n "$SONAR_TOKEN" ]; then sonar="[ver painel](https://sonarcloud.io/project/overview?id=${SONAR_PROJECT_KEY:-Aruw_Oficina-Mecanica})"; else sonar="não configurado"; fi
          {
            echo "### Análise estática"
            echo "| Ferramenta | Achados |"
            echo "|---|---|"
            echo "| CodeQL (security-and-quality) | ${alertas:-0} |"
            echo "| PMD — violações | ${violacoes:-0} |"
            echo "| CPD — trechos duplicados | ${duplicacoes:-0} |"
            echo "| SonarQube Cloud | $sonar |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefato — análise estática
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analise-estatica
          path: |
            codeql-resultados
            app/target/pmd.xml
            app/target/cpd.xml
            app/target/reports

  vulnerabilidades:
    name: Vulnerabilidades (Trivy)
    # O merge do bump de versão (PR chore/proxima-versao-*) só altera o pom e já foi validado na própria branch.
    if: >
      github.event_name != 'push' || !(
        contains(github.event.head_commit.message, 'chore/proxima-versao-') ||
        startsWith(github.event.head_commit.message, 'chore: próxima versão') ||
        startsWith(github.event.head_commit.message, 'chore: prepara a próxima versão'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy — dependências, segredos e configuração
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: trivy-repositorio.json

      - name: Build da imagem Docker
        run: docker build -t oficina-api:${{ github.sha }} app

      - name: Trivy — imagem Docker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oficina-api:${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: trivy-imagem.json

      - name: Trivy — imagem Docker (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oficina-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-imagem.sarif

      - name: Enviar resultado ao GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-imagem.sarif
          category: trivy-imagem

      - name: Gerar relatório em Markdown
        if: always()
        run: |
          python3 -I .github/scripts/relatorio_trivy.py \
            trivy-repositorio.json trivy-imagem.json relatorio-vulnerabilidades.md
          cat relatorio-vulnerabilidades.md >> "$GITHUB_STEP_SUMMARY"

      - name: Artefato — vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerabilidades
          path: |
            relatorio-vulnerabilidades.md
            trivy-repositorio.json
            trivy-imagem.json
            trivy-imagem.sarif

  publicar-snapshot:
    name: Publicar snapshot no Nexus
    runs-on: ubuntu-latest
    needs: [build-testes, analise-estatica, vulnerabilidades]
    # Exemplo do fluxo ideal: só roda quando a variável NEXUS_URL estiver cadastrada no repositório.
    if: vars.NEXUS_URL != ''
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21 e credenciais do Nexus
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Deploy do SNAPSHOT (maven-snapshots)
        env:
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: >
          mvn -B deploy -DskipTests -Djacoco.skip=true
          "-DaltSnapshotDeploymentRepository=nexus::${NEXUS_URL}/repository/maven-snapshots/"

  excluir-branch:
    name: Excluir branch mergeada
    runs-on: ubuntu-latest
    needs: [build-testes, analise-estatica, vulnerabilidades, publicar-snapshot]
    # Roda sempre ao final do pipeline, mesmo que algum job anterior tenha falhado ou sido pulado.
    if: always() && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Excluir a branch de origem do PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t BRANCHES < <(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq ".[] | select(.merged_at != null and .base.ref == \"develop\" and .head.repo.full_name == \"${GITHUB_REPOSITORY}\") | .head.ref")
          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "Nenhum PR mergeado associado a este commit; nada a excluir." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for BRANCH in "${BRANCHES[@]}"; do
            case "$BRANCH" in main|develop) continue ;; esac
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" --silent 2>erro.txt; then
              echo "Branch \`$BRANCH\` excluída após o pipeline da develop passar." >> "$GITHUB_STEP_SUMMARY"
            elif grep -q "Reference does not exist" erro.txt; then
              echo "Branch \`$BRANCH\` já havia sido excluída." >> "$GITHUB_STEP_SUMMARY"
            else
              cat erro.txt
              exit 1
            fi
          done
