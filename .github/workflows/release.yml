name: 📦 Release

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Sobrescrever versão da release (opcional, ex.: 1.2.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: write
  statuses: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Gerar release
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      proxima: ${{ steps.versao.outputs.proxima }}
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Definir versão da release e próxima versão
        id: versao
        env:
          INFORMADA: ${{ inputs.versao }}
        run: |
          ATUAL=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          INFORMADA=$(echo "$INFORMADA" | tr -d '[:space:]')
          if [ -n "$INFORMADA" ]; then
            VERSAO="${INFORMADA#v}"
          else
            VERSAO="${ATUAL%-SNAPSHOT}"
          fi
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida '$VERSAO'. Use o formato X.Y.Z (ex.: 1.2.0)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSAO" >/dev/null; then
            echo "::error::A tag v$VERSAO já existe. Informe outra versão."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSAO"
          PROXIMA="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          {
            echo "atual=$ATUAL"
            echo "versao=$VERSAO"
            echo "proxima=$PROXIMA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release"
            echo "| Versão no pom (main) | Release | Próxima versão de desenvolvimento |"
            echo "|---|---|---|"
            echo "| \`$ATUAL\` | **\`$VERSAO\`** | \`$PROXIMA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aplicar a versão da release no pom
        run: mvn -B -q versions:set -DnewVersion=${{ steps.versao.outputs.versao }}

      - name: Build (compilação do código e dos testes)
        run: mvn -B test-compile

      - name: Testes unitários
        run: mvn -B test -Dtest='**/*Test*' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Testes de integração
        run: mvn -B test -Dtest='**/*IT' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Cobertura mínima de 80% (domain + application)
        run: mvn -B jacoco:report jacoco:check@check

      - name: Empacotar aplicação (jar)
        run: mvn -B package -DskipTests -Djacoco.skip=true

      - name: Login no GitHub Container Registry
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build da imagem Docker
        id: imagem
        run: |
          IMAGEM="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oficina-api"
          VERSAO="${{ steps.versao.outputs.versao }}"
          docker build \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$VERSAO" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$IMAGEM:$VERSAO" -t "$IMAGEM:latest" .
          echo "imagem=$IMAGEM" >> "$GITHUB_OUTPUT"

      - name: Publicar imagem Docker no GHCR
        run: |
          docker push "${{ steps.imagem.outputs.imagem }}:${{ steps.versao.outputs.versao }}"
          docker push "${{ steps.imagem.outputs.imagem }}:latest"

      - name: Commit e tag da release
        run: |
          VERSAO="${{ steps.versao.outputs.versao }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git diff --cached --quiet || git commit -m "release: v$VERSAO"
          git tag -a "v$VERSAO" -m "Release v$VERSAO"
          git push origin "v$VERSAO"

      - name: Empacotar relatórios para a release
        run: |
          VERSAO="${{ steps.versao.outputs.versao }}"
          (cd target/site && zip -qr "../../../cobertura-jacoco-$VERSAO.zip" jacoco)
          (cd target && zip -qr "../../resultado-testes-$VERSAO.zip" surefire-reports)

      - name: Criar GitHub Release
        working-directory: .
        run: |
          VERSAO="${{ steps.versao.outputs.versao }}"
          IMAGEM="${{ steps.imagem.outputs.imagem }}"
          cat > notas.md <<EOF
          ## Oficina Mecânica API v$VERSAO

          **Imagem Docker:** \`docker pull $IMAGEM:$VERSAO\`

          Artefatos anexos: aplicação (\`oficina-$VERSAO.jar\`), resultado dos testes e relatório de cobertura.
          EOF
          gh release create "v$VERSAO" \
            --verify-tag \
            --title "v$VERSAO" \
            --notes-file notas.md \
            --generate-notes \
            "app/target/oficina-$VERSAO.jar" \
            "cobertura-jacoco-$VERSAO.zip" \
            "resultado-testes-$VERSAO.zip"

  publicar-release:
    name: Publicar release no Nexus
    runs-on: ubuntu-latest
    needs: release
    # Exemplo do fluxo ideal: só roda quando a variável NEXUS_URL estiver cadastrada no repositório.
    if: vars.NEXUS_URL != ''
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout da tag da release
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.versao }}

      - name: Configurar Java 21 e credenciais do Nexus
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Deploy da release (maven-releases)
        env:
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: >
          mvn -B deploy -DskipTests -Djacoco.skip=true
          "-DaltReleaseDeploymentRepository=nexus::${NEXUS_URL}/repository/maven-releases/"

  proxima-versao:
    name: Próxima versão
    runs-on: ubuntu-latest
    needs: release
    env:
      PROXIMA: ${{ needs.release.outputs.proxima }}
      VERSAO: ${{ needs.release.outputs.versao }}
      # Token pessoal (PAT) opcional: com ele o PR dispara o 🔍 Validate e pode ser aprovado pelo github-actions.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Atualizar o pom para a próxima versão
        id: branch
        run: |
          if git ls-remote --exit-code --heads origin develop >/dev/null; then BASE=develop; else BASE=main; fi
          BRANCH="chore/proxima-versao-$PROXIMA"
          git fetch origin "$BASE"
          git checkout -B "$BRANCH" "origin/$BASE"
          (cd app && mvn -B -q versions:set -DnewVersion="$PROXIMA")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pom.xml
          git commit -m "chore: prepara a próxima versão de desenvolvimento $PROXIMA"
          git push --force origin "$BRANCH"
          {
            echo "base=$BASE"
            echo "branch=$BRANCH"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Abrir Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          URL=$(gh pr create \
            --base "${{ steps.branch.outputs.base }}" \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "chore: próxima versão $PROXIMA" \
            --body "Gerado pelo workflow 📦 Release após publicar v$VERSAO. Atualiza o pom para \`$PROXIMA\`. Aprovado e mergeado automaticamente.")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PR: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Executar 🔍 Validate na branch e aguardar
        id: validate
        # Sem RELEASE_TOKEN, o push do bot não dispara workflows: o Validate é executado manualmente (workflow_dispatch).
        # Com RELEASE_TOKEN, o próprio push já disparou o Validate; só aguarda essa execução.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            gh workflow run validate.yml --ref "$BRANCH"
            EVENTO=workflow_dispatch
          else
            EVENTO=push
          fi
          ID=""
          for _ in $(seq 1 30); do
            ID=$(gh run list --workflow validate.yml --branch "$BRANCH" --event "$EVENTO" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$ID" ] && break
            sleep 5
          done
          if [ -z "$ID" ]; then
            echo "::error::A execução do 🔍 Validate na branch $BRANCH não foi encontrada."
            exit 1
          fi
          URL="https://github.com/${GH_REPO}/actions/runs/$ID"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🔍 Validate: $URL" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$ID" --exit-status --interval 15

      - name: Registrar o check Cobertura no PR
        # Execuções manuais (workflow_dispatch) não contam para a proteção da branch. Como o Validate passou,
        # o resultado é publicado como status "Cobertura" no commit do PR (criado pelo GitHub Actions).
        if: env.RELEASE_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.branch.outputs.sha }}
          URL: ${{ steps.validate.outputs.url }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=success \
            -f context=Cobertura \
            -f description="🔍 Validate aprovado (build, testes e cobertura >= 80%)" \
            -f target_url="$URL" --silent

      - name: Aprovar Pull Request
        # Quem abre o PR não pode aprová-lo. Com o PAT, o autor é o dono do token e o github-actions aprova.
        if: env.RELEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr review "${{ steps.pr.outputs.url }}" --approve --body "Atualização automática de versão após a release v$VERSAO."

      - name: Merge do Pull Request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          PR="${{ steps.pr.outputs.url }}"
          # O GitHub leva alguns segundos para reconhecer o check "Cobertura" recém-concluído; tenta por até 3 minutos.
          for tentativa in $(seq 1 18); do
            if gh pr merge "$PR" --squash --delete-branch; then
              echo "PR mergeado na develop (tentativa $tentativa)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Merge ainda não permitido (tentativa $tentativa/18); nova tentativa em 10s..."
            sleep 10
          done
          if gh pr merge "$PR" --squash --delete-branch --auto; then
            echo "Auto-merge habilitado: o PR será mergeado assim que as regras forem atendidas." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Não foi possível mergear $PR. Verifique as regras da develop (docs/processo/github.md)."
            exit 1
          fi
