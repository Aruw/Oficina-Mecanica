version: 2

updates:
  - package-ecosystem: maven
    directory: /app
    target-branch: develop
    schedule:
      interval: monthly
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    groups:
      maven-seguranca:
        applies-to: security-updates
        patterns:
          - "*"
      maven:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"