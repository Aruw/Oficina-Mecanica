spring:
  datasource:
    url: jdbc:h2:mem:oficina;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: segredo-de-teste-com-pelo-menos-32-caracteres
      issuer: oficina-api
      expiration: PT1H
    admin:
      username: admin
      password: senha-de-teste

logging:
  level:
    root: WARN
    com.aruw.oficina: INFO
